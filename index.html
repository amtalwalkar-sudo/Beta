<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Break-Even Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
</head>
<body class="bg-light">
  <div class="container py-4">
    <header class="pb-3 mb-4 border-bottom">
      <h1 class="h3">Break-Even Dashboard</h1>
    </header>

    <!-- Dashboard Summary Cards -->
    <div class="row g-4 mb-4">
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title text-muted">Daily Break-Even</h5>
            <h3 id="dailyBreakEven" class="text-primary">$0.00</h3>
            <small class="text-muted" id="dailyKm">0 km logged today</small>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title text-muted">Weekly Break-Even</h5>
            <h3 id="weeklyBreakEven" class="text-primary">$0.00</h3>
            <small class="text-muted" id="weeklyKm">0 km logged this week</small>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title text-muted">Monthly Break-Even</h5>
            <h3 id="monthlyBreakEven" class="text-primary">$0.00</h3>
            <small class="text-muted" id="monthlyKm">0 km logged this month</small>
          </div>
        </div>
      </div>
    </div>

    <!-- Session Input Form -->
    <div class="row g-4">
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title mb-3">Log Driving Session</h5>
            <form id="sessionForm">
              <div class="mb-3">
                <label for="startOdo" class="form-label">Start Odometer (km)</label>
                <input type="number" class="form-control" id="startOdo" required step="0.1">
              </div>
              <div class="mb-3">
                <label for="endOdo" class="form-label">End Odometer (km)</label>
                <input type="number" class="form-control" id="endOdo" required step="0.1">
              </div>
              <button type="submit" class="btn btn-primary w-100">Record Session</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Session Log History Table -->
      <div class="col-md-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title mb-3">Recent Sessions</h5>
            <div class="table-responsive" style="max-height: 250px; overflow-y: auto;">
              <table class="table table-striped table-sm">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Distance</th>
                    <th>Variable Cost</th>
                  </tr>
                </thead>
                <tbody id="sessionTableBody">
                  <!-- Dynamic rows injected here -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
